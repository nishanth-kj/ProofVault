name: CI (Python Backend)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          
      - name: Install dependencies
        run: |
          cd api
          uv venv
          uv pip install -r requirements.txt
          
      - name: Lint with Ruff
        run: |
          cd api
          # Install ruff (the ultra-fast Python linter) to check for syntax errors
          uv pip install ruff
          uv run ruff check .
