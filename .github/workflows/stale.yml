name: Close Stale Issues

on:
  schedule:
    - cron: '0 0 * * *' # Runs every midnight

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v11
        with:
          stale-issue-message: 'This issue is stale because it has been open for 30 days with no activity. Please remove the stale label or comment to keep it open, otherwise it will be closed in 5 days.'
          stale-pr-message: 'This Pull Request is stale because it has been open for 45 days with no activity. Please remove the stale label or comment to keep it open, otherwise it will be closed in 10 days.'
          days-before-stale: 30
          days-before-close: 5
          days-before-pr-stale: 45
          days-before-pr-close: 10
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
